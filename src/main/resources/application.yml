# =============================================
# 🟢 CONFIGURATION DU SERVEUR EUREKA PAR DÉFAUT
# =============================================
spring:
  application:
    name: eureka-server
  config:
    activate:
      on-profile: default

server:
  port: 9000

eureka:
  instance:
    hostname: default-eureka-server.com
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/


# =============================================
# 🟠 EUREKA SERVER 1 (CLUSTER)
# =============================================
---
spring:
  application:
    name: eureka-server-clustered
  config:
    activate:
      on-profile: eureka-1

server:
  port: 9001

eureka:
  instance:
    hostname: eureka-1-server.com
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-2-server.com:9002/eureka/,http://eureka-3-server.com:9003/eureka/


